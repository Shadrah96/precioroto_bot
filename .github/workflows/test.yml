name: test

on:
  push:
    paths: ['src/**', 'package.json', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test "src/**/*.test.ts"
